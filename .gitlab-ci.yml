# GitLab CI/CD Pipeline for Altair NFSv2 Boot Server

stages:
  - build

build-altair:
  stage: build
  image: docker:24-dind
  services:
    - docker:24-dind
  variables:
    DOCKER_TLS_CERTDIR: "/certs"
  before_script:
    - echo "$CI_REGISTRY_PASSWORD" | docker login -u "$CI_REGISTRY_USER" --password-stdin $CI_REGISTRY
  script:
    - docker build -t $CI_REGISTRY_IMAGE/nfsv2:altair .
    - docker push $CI_REGISTRY_IMAGE/nfsv2:altair
