services:
  nfsv2-server:
    build:
      context: .
      dockerfile: Dockerfile.debian
    container_name: nfsv2-vxworks-debian
    privileged: true
    volumes:
      - ./vxworks-files:/nfs/vxworks
    restart: unless-stopped
    ports:
      - "111:111/tcp"
      - "111:111/udp"
      - "2049:2049/tcp"
      - "2049:2049/udp"
    cap_add:
      - SYS_ADMIN
      - NET_ADMIN
    environment:
      - TZ=America/New_York

