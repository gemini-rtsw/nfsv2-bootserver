version: '3.8'

services:
  nfsv2-server:
    build: .
    container_name: nfsv2-vxworks
    privileged: true
    volumes:
      - ./vxworks-files:/nfs/vxworks
    restart: unless-stopped
    cap_add:
      - SYS_ADMIN
      - SYS_MODULE
      - NET_ADMIN
    ports:
      - "111:111/tcp"
      - "111:111/udp"
      - "2049:2049/tcp"
      - "2049:2049/udp"
      - "20048:20048/tcp"
      - "20048:20048/udp"
      - "512:512/tcp"
      - "513:513/tcp"
      - "514:514/tcp"
    environment:
      - TZ=America/New_York

